<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk — Crown Barbershop</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS Files -->
    <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-brand">
            <a href="../pages/barber.php">
                <img src="../assets/img/logo.svg" alt="Crown Barbershop Logo" class="auth-brand-logo">
            </a>
            <div class="auth-brand-title">CROWN <span>BARBER</span></div>
        </div>

        <h1 class="auth-title">Selamat Datang</h1>
        <p class="auth-subtitle">Masuk ke akun Anda untuk melakukan reservasi & kelola booking</p>

        <!-- Alert Box -->
        <div class="auth-alert" id="auth-alert" style="display:none;"></div>

        <form id="form-login">
            <div class="input-group">
                <label for="user_email">Alamat Email</label>
                <input type="email" id="user_email" name="email"
                       placeholder="nama@email.com" required autocomplete="email">
            </div>

            <div class="input-group">
                <label for="pass">Kata Sandi</label>
                <input type="password" id="pass" name="password"
                       placeholder="Masukkan kata sandi Anda" required>
            </div>

            <button type="submit" class="auth-button" id="btn-login">
                Masuk Sekarang
            </button>
        </form>

        <p class="auth-footer">
            Belum punya akun? <a href="register.html">Daftar Akun Baru</a>
        </p>

        <div style="margin-top: 1.2rem;">
            <a href="../pages/barber.php" style="font-size: 0.82rem; color: #757d8a; text-decoration: none;">
                ← Kembali ke Halaman Utama
            </a>
        </div>
    </div>

<script>
    const form     = document.getElementById('form-login');
    const btnLogin = document.getElementById('btn-login');
    const alertBox = document.getElementById('auth-alert');

    function tampilAlert(pesan, tipe = 'error') {
        alertBox.textContent   = pesan;
        alertBox.className     = `auth-alert auth-alert--${tipe}`;
        alertBox.style.display = 'block';
    }

    form.addEventListener('submit', async function (e) {
        e.preventDefault();

        const email    = document.getElementById('user_email').value.trim();
        const password = document.getElementById('pass').value.trim();

        btnLogin.disabled    = true;
        btnLogin.textContent = 'Memproses...';

        try {
            const res  = await fetch('../api/auth.php', {
                method : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body   : JSON.stringify({ action: 'login', email, password })
            });

            const data = await res.json();

            if (data.success) {
                tampilAlert(data.message, 'success');
                setTimeout(() => {
                    window.location.href = data.redirect || '../pages/barber.php';
                }, 800);
            } else {
                tampilAlert(data.message, 'error');
                btnLogin.disabled    = false;
                btnLogin.textContent = 'Masuk Sekarang';
            }

        } catch (err) {
            tampilAlert('Terjadi kesalahan. Coba lagi.', 'error');
            btnLogin.disabled    = false;
            btnLogin.textContent = 'Masuk Sekarang';
        }
    });
</script>

</body>
</html>
