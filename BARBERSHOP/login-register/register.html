<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar — Crown Barbershop</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS Files -->
    <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-brand">
            <a href="../pages/barber.php">
                <img src="../assets/img/logo.svg" alt="Crown Barbershop Logo" class="auth-brand-logo">
            </a>
            <div class="auth-brand-title">CROWN <span>BARBER</span></div>
        </div>

        <h1 class="auth-title">Buat Akun Baru</h1>
        <p class="auth-subtitle">Daftar sekarang untuk menikmati kemudahan booking online</p>

        <!-- Alert Box -->
        <div class="auth-alert" id="auth-alert" style="display:none;"></div>

        <form id="form-register">
            <div class="input-group">
                <label for="email">Alamat Email</label>
                <input type="email" id="email" name="email"
                       placeholder="nama@email.com" required autocomplete="email">
            </div>

            <div class="input-group">
                <label for="username">Nama Lengkap</label>
                <input type="text" id="username" name="username"
                       placeholder="Masukkan nama lengkap Anda" required>
            </div>

            <div class="input-group">
                <label for="phone">Nomor HP / WhatsApp</label>
                <div class="phone-input-group">
                    <span class="phone-prefix">+62</span>
                    <input type="tel" id="phone" name="phone"
                           placeholder="81234567890" required>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Kata Sandi</label>
                <input type="password" id="password" name="password"
                       placeholder="Minimal 6 karakter" required>
            </div>

            <button type="submit" class="auth-button" id="btn-register">
                Daftar Sekarang
            </button>
        </form>

        <p class="auth-footer">
            Sudah punya akun? <a href="login.html">Masuk di sini</a>
        </p>

        <div style="margin-top: 1.2rem;">
            <a href="../pages/barber.php" style="font-size: 0.82rem; color: #757d8a; text-decoration: none;">
                ← Kembali ke Halaman Utama
            </a>
        </div>
    </div>

<script>
    const form     = document.getElementById('form-register');
    const btnReg   = document.getElementById('btn-register');
    const alertBox = document.getElementById('auth-alert');

    function tampilAlert(pesan, tipe = 'error') {
        alertBox.textContent   = pesan;
        alertBox.className     = `auth-alert auth-alert--${tipe}`;
        alertBox.style.display = 'block';
    }

    form.addEventListener('submit', async function (e) {
        e.preventDefault();

        const email    = document.getElementById('email').value.trim();
        const nama     = document.getElementById('username').value.trim();
        const phone    = document.getElementById('phone').value.trim();
        const password = document.getElementById('password').value.trim();

        btnReg.disabled    = true;
        btnReg.textContent = 'Mendaftarkan...';

        try {
            const res  = await fetch('../api/auth.php', {
                method : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body   : JSON.stringify({
                    action  : 'register',
                    nama,
                    email,
                    no_hp   : '+62' + phone,
                    password
                })
            });

            const data = await res.json();

            if (data.success) {
                tampilAlert(data.message, 'success');
                setTimeout(() => {
                    window.location.href = data.redirect || 'login.html';
                }, 1000);
            } else {
                tampilAlert(data.message, 'error');
                btnReg.disabled    = false;
                btnReg.textContent = 'Daftar Sekarang';
            }

        } catch (err) {
            tampilAlert('Terjadi kesalahan. Coba lagi.', 'error');
            btnReg.disabled    = false;
            btnReg.textContent = 'Daftar Sekarang';
        }
    });
</script>

</body>
</html>
